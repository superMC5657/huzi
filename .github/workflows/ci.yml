name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x64
            runner: ubuntu-24.04
            arch: x86_64
          - os: windows-x64
            runner: windows-2022
            arch: x86_64
          - os: macos-arm64
            runner: macos-14
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 18 (Ubuntu)
        if: matrix.os == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev clang lld-18
          sudo ln -sf /usr/bin/llc-18 /usr/local/bin/llc
          sudo ln -sf /usr/bin/opt-18 /usr/local/bin/opt
          echo "LLVM_SYS_180_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"

      - name: Install LLVM 18 (Windows)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/LLVM-18.1.8-win64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\llvm.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\llvm.exe" -ArgumentList "/S" -Wait
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          "LLVM_SYS_180_PREFIX=C:\Program Files\LLVM" >> $env:GITHUB_ENV

      - name: Install LLVM 18 (macOS)
        if: matrix.os == 'macos-arm64'
        run: |
          brew install llvm@18
          echo "LLVM_SYS_180_PREFIX=$(brew --prefix llvm@18)" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@18)/bin" >> "$GITHUB_PATH"

      - name: Check LLVM tools
        shell: bash
        run: |
          llc --version | head -1
          opt --version | head -1

      - name: Build (zero warnings)
        shell: bash
        run: RUSTFLAGS="-D warnings" cargo build --workspace

      - name: Unit tests
        shell: bash
        run: cargo test --workspace

      - name: Regression tests (examples + negative)
        shell: bash
        run: bash test.sh

      - name: Standard library tests
        shell: bash
        run: |
          if [ -f ../huzi-src/test.sh ]; then
            bash ../huzi-src/test.sh
          fi

      - name: Code formatting check
        shell: bash
        run: |
          EXE="./target/debug/huzc"
          [ -f "${EXE}.exe" ] && EXE="${EXE}.exe"
          "$EXE" fmt --check test/examples

      - name: Build release
        shell: bash
        run: cargo build --workspace --release

      - name: Benchmark regression gate
        shell: bash
        run: |
          PY=""
          for cand in python3 python py; do
            if "$cand" -c "import sys; exit(0 if sys.version_info[0] >= 3 else 1)" >/dev/null 2>&1; then
              PY="$cand"
              break
            fi
          done
          [ -n "$PY" ] || { echo "Python 3 not found"; exit 1; }
          "$PY" test/bench_compare.py


      - name: Stage release artifact
        shell: bash
        run: |
          mkdir -p staging
          EXE="./target/release/huzc"
          [ -f "${EXE}.exe" ] && EXE="${EXE}.exe"
          cp "$EXE" staging/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: huzc-${{ matrix.os }}
          path: staging/

